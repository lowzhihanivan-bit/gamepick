name: Update game database

on:
  schedule:
    - cron: '0 2 * * 0'   # Every Sunday at 2am UTC
  workflow_dispatch:        # Also allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create data directory
        run: mkdir -p data

      - name: Fetch games from recommend.games
        run: npm run ingest

      - name: Compute ratings and metrics
        run: npm run compute

      - name: Push updated data to Turso
        run: npx tsx --no-warnings scripts/migrate-to-turso.ts
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
